<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Builder — 3D Map Renderer Experiment</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.0.0/dist/maplibre-logo-control.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-scene3d-control@0.3.3/dist/maplibre-scene3d-control.css">
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#152b35}
#map{position:absolute;inset:0}
#experiment-ui{position:absolute;z-index:20;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;font:13px system-ui,sans-serif;color:#f3f8fc}
.panel{pointer-events:auto;background:rgba(10,25,38,.82);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:10px 12px;backdrop-filter:blur(16px);box-shadow:0 8px 26px #0004}
#title{font-weight:700;letter-spacing:.02em}#subtitle{color:#b8c8d2;font-size:11px;margin-top:3px}
.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
button{border:1px solid rgba(255,255,255,.14);border-radius:999px;background:#172c40;color:#f5fbff;padding:10px 13px;font-weight:650;font-size:12px;min-height:40px}
button:active{background:#24505b}
#status{position:absolute;z-index:20;bottom:14px;left:14px;max-width:min(520px,calc(100% - 28px));font:12px/1.4 system-ui,sans-serif;color:#e9f4f8}
#back{pointer-events:auto;text-decoration:none;color:#eaf7ff;font-weight:700}
.maplibregl-ctrl-group{border-radius:14px!important;overflow:hidden}
@media(max-width:600px){#experiment-ui{top:8px;left:8px;right:8px}.panel{padding:8px 10px}.controls{max-width:68%}button{padding:8px 10px;font-size:11px;min-height:36px}#status{bottom:8px;left:8px}}
</style>
<script type="importmap">
{"imports":{"maplibre-gl":"https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.mjs"}}
</script>
</head>
<body>
<div id="map" aria-label="Experimental three-dimensional map"></div>
<div id="experiment-ui">
 <div class="panel"><div id="title">SUBWAY BUILDER · 3D MAP TEST</div><div id="subtitle">MapLibre GL · San Francisco · Experimental only</div></div>
 <div class="panel controls">
  <button id="pitch">Tilt: 65°</button>
  <button id="bearing">Rotate</button>
  <button id="overlay" aria-pressed="true">Track overlay: on</button>
  <button id="back"><a href="index.html" style="color:inherit;text-decoration:none">Back to game</a></button>
 </div>
</div>
<div id="status" class="panel">Loading keyless vector map…</div>
<script type="module">
import * as maplibregl from 'maplibre-gl';
import {LogoControl} from 'https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.0.0/+esm';
import {Scene3dControl} from 'https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-scene3d-control@0.3.3/dist/maplibre-scene3d-control.standalone.js';

const center=[-122.4194,37.7749];
const map=new maplibregl.Map({
 container:'map',
 style:'https://styles.maptoolkit.org/street.json',
 center,zoom:15.5,pitch:65,bearing:-18,maxPitch:85,
 attributionControl:{customAttribution:'',compact:false},
 canvasContextAttributes:{antialias:true}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
map.addControl(new LogoControl());
map.addControl(new Scene3dControl());
const status=document.getElementById('status');
let pitch=65,bearing=-18,overlayVisible=true;
const route={type:'FeatureCollection',features:[
 {type:'Feature',properties:{kind:'rail'},geometry:{type:'LineString',coordinates:[[-122.4231,37.7728],[-122.4219,37.7737],[-122.4205,37.7745],[-122.4191,37.7753],[-122.4177,37.7761],[-122.4164,37.7769]]}},
 {type:'Feature',properties:{kind:'rail'},geometry:{type:'LineString',coordinates:[[-122.4230,37.77265],[-122.4218,37.77355],[-122.4204,37.77435],[-122.4190,37.77515],[-122.4176,37.77595],[-122.4163,37.77675]]}},
 {type:'Feature',properties:{kind:'platform'},geometry:{type:'Polygon',coordinates:[[[-122.42035,37.77462],[-122.41995,37.77490],[-122.41982,37.77477],[-122.42022,37.77449],[-122.42035,37.77462]]]}},
 {type:'Feature',properties:{kind:'platform'},geometry:{type:'Polygon',coordinates:[[[-122.41895,37.77542],[-122.41855,37.77570],[-122.41842,37.77557],[-122.41882,37.77529],[-122.41895,37.77542]]]}}
]};
map.on('load',()=>{
 map.addSource('sb-demo-geometry',{type:'geojson',data:route});
 map.addLayer({id:'sb-demo-platforms',type:'fill',source:'sb-demo-geometry',filter:['==',['get','kind'],'platform'],paint:{'fill-color':'#56d7c5','fill-opacity':0.24}});
 map.addLayer({id:'sb-demo-platform-outlines',type:'line',source:'sb-demo-geometry',filter:['==',['get','kind'],'platform'],paint:{'line-color':'#62e5d2','line-width':2.5}});
 map.addLayer({id:'sb-demo-rails-casing',type:'line',source:'sb-demo-geometry',filter:['==',['get','kind'],'rail'],paint:{'line-color':'#142b3a','line-width':8,'line-opacity':0.95}});
 map.addLayer({id:'sb-demo-rails',type:'line',source:'sb-demo-geometry',filter:['==',['get','kind'],'rail'],paint:{'line-color':'#b8d3dc','line-width':3.2,'line-dasharray':[1.4,1.2]}});
 status.textContent='3D renderer loaded. Tilt, rotate, and inspect the sample rails/platforms. These are test overlays, not your saved game tracks.';
});
map.on('error',e=>{const message=e?.error?.message||'Map resource failed';status.textContent='Map loading issue: '+message;});
document.getElementById('pitch').addEventListener('click',()=>{pitch=pitch>=80?35:Math.min(85,pitch+10);map.easeTo({pitch,duration:450});document.getElementById('pitch').textContent='Tilt: '+pitch+'°';});
document.getElementById('bearing').addEventListener('click',()=>{bearing+=45;map.easeTo({bearing,duration:550});});
document.getElementById('overlay').addEventListener('click',()=>{overlayVisible=!overlayVisible;for(const id of ['sb-demo-platforms','sb-demo-platform-outlines','sb-demo-rails-casing','sb-demo-rails'])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',overlayVisible?'visible':'none');document.getElementById('overlay').textContent='Track overlay: '+(overlayVisible?'on':'off');document.getElementById('overlay').setAttribute('aria-pressed',String(overlayVisible));});
</script>
</body>
</html>
