<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Builder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.topbar{position:absolute;z-index:500;top:10px;left:10px;right:10px;background:#172438ed;border:1px solid #40516a;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:bold;font-size:16px}
.stats{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.stat strong{display:block;color:#62d9c4;font-size:14px;margin-top:3px}
.panel{position:absolute;z-index:500;top:82px;left:10px;width:150px;background:#172438ed;border:1px solid #40516a;border-radius:12px;padding:9px}
.panel{
 max-height:calc(100dvh - 175px);
 overflow-y:auto;
 overscroll-behavior:contain;
}
.panel h3{font-size:12px;color:#9eb4cb;margin:3px 0 9px}
button{border:0;border-radius:8px;padding:10px 8px;color:white;background:#30445f;font-weight:bold;font-size:12px;width:100%;margin-bottom:7px}
button.active{background:#087f79}
button:disabled{opacity:.35}
button:active{opacity:.7}
.bottom{position:absolute;z-index:500;bottom:12px;left:10px;right:10px;background:#172438ed;border:1px solid #40516a;border-radius:12px;padding:9px;display:flex;gap:7px}
.bottom button{margin:0;flex:1}
#message{position:absolute;z-index:500;bottom:76px;left:50%;transform:translateX(-50%);background:#172438ed;padding:9px 13px;border-radius:9px;font-size:12px;max-width:90%;text-align:center}
.leaflet-control-attribution{font-size:9px!important}
@media(max-height:430px){.topbar{top:5px;padding:6px}.panel{top:65px}.bottom{bottom:5px}.panel button{padding:7px}.stats{gap:7px}}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
 <div class="brand">🚇 SUBWAY BUILDER</div>
 <div class="stats">
  <div class="stat">CITY<strong>San Francisco</strong></div>
  <div class="stat">MONEY<strong id="money">$25,000</strong></div>
  <div class="stat">PASSENGERS<strong id="passengers">0</strong></div>
 </div>
</div>

<div class="panel">
 <h3>CONSTRUCTION</h3>
 <button id="stationBtn" class="active" onclick="setMode('station')">＋ Station</button>
 <button id="trackBtn" onclick="setMode('track')">〰 Build Track</button>
 <button onclick="setMode('inspect')">ⓘ Inspect</button>
 <h3>EDIT</h3>
 <button id="undoBtn" onclick="undo()">↶ Undo</button>
 <button id="redoBtn" onclick="redo()">↷ Redo</button>
 <h3>MAP APPEARANCE</h3>
<button id="themeToggleBtn" type="button">🌙 Map Theme</button>
<div id="mapMenu" style="display:none;background:#24364d;padding:9px;border-radius:9px;margin-bottom:10px">
  <button onclick="setMapTheme('light')">☀️ Light Map</button>
  <button onclick="setMapTheme('dark')">🌙 Dark Map</button>
</div>
 <h3>NETWORK</h3>
 <div id="stationCount" style="font-size:12px;margin:5px 0 10px">Stations: 0</div>
 <div id="trackCount" style="font-size:12px;margin:5px 0">Track: 0 sections</div>
</div>

<div id="message">Tap the map to build your first station.</div>

<div class="bottom">
 <button id="runBtn" onclick="toggleSimulation()">▶ Run Trains</button>
 <button onclick="resetSelection()">Cancel</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([37.7749,-122.4194],13);

const lightTiles = L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
 }
);

const darkTiles = L.tileLayer(
 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
 {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
 }
);

let currentTheme=localStorage.getItem('mapTheme')||'light';

function setMapTheme(theme){
 if(theme!=='light'&&theme!=='dark')return;

 map.removeLayer(lightTiles);
 map.removeLayer(darkTiles);

 if(theme==='dark'){
  darkTiles.addTo(map);
  message('Dark map enabled.');
 }else{
  lightTiles.addTo(map);
  message('Light map enabled.');
 }

 currentTheme=theme;
 localStorage.setItem('mapTheme',theme);
}

function toggleMapMenu(){
 const menu=document.getElementById('mapMenu');
 menu.style.display=menu.style.display==='none'?'block':'none';
}
document.getElementById('themeToggleBtn').addEventListener('click',toggleMapMenu);
setMapTheme(currentTheme);

L.control.zoom({position:'bottomright'}).addTo(map);

let mode='station';
let money=25000;
let passengers=0;
let stations=[];
let tracks=[];
let selected=null;
let running=false;
let simulation=null;
let trainMarkers=[];
let history=[];
let historyIndex=0;

function message(t){
 document.getElementById('message').textContent=t;
}

function snapshot(){
 return {
  money:money,
  stations:stations.map(s=>({
   lat:s.lat,lng:s.lng
  })),
  tracks:tracks.map(t=>({
   a:t.a,b:t.b
  }))
 };
}

function saveHistory(){
 history=history.slice(0,historyIndex+1);
 history.push(snapshot());
 historyIndex=history.length-1;
 updateUI();
}

function restoreSnapshot(data){
 money=data.money;
 stations=data.stations.map((s,i)=>({
  lat:s.lat,lng:s.lng,
  name:'Station '+(i+1)
 }));
 tracks=data.tracks.map(t=>({a:t.a,b:t.b}));
 selected=null;
 renderNetwork();
 updateUI();
}

function undo(){
 if(historyIndex<=0){
  message('Nothing to undo.');
  return;
 }
 historyIndex--;
 restoreSnapshot(history[historyIndex]);
 message('Last construction action undone.');
}

function redo(){
 if(historyIndex>=history.length-1){
  message('Nothing to redo.');
  return;
 }
 historyIndex++;
 restoreSnapshot(history[historyIndex]);
 message('Construction action restored.');
}

function renderNetwork(){
 if(window.networkLayer){
  map.removeLayer(window.networkLayer);
 }
 window.networkLayer=L.layerGroup().addTo(map);

 tracks.forEach(t=>{
  let a=stations[t.a];
  let b=stations[t.b];
  if(!a||!b)return;

  L.polyline([
   [a.lat,a.lng],
   [b.lat,b.lng]
  ],{
   color:'#087f79',
   weight:6,
   opacity:1,
   lineCap:'round'
  }).addTo(window.networkLayer);
 });

 stations.forEach((s,i)=>{
  let marker=L.circleMarker([s.lat,s.lng],{
   radius:selected===i?13:9,
   color:'#ffffff',
   weight:3,
   fillColor:selected===i?'#e5a52b':'#087f79',
   fillOpacity:1
  }).addTo(window.networkLayer);

  marker.bindTooltip(s.name);

  marker.on('click',function(e){
   L.DomEvent.stopPropagation(e);
   handleStationClick(i);
  });
 });
}

function updateUI(){
 document.getElementById('money').textContent='$'+money.toLocaleString();
 document.getElementById('passengers').textContent=passengers.toLocaleString();
 document.getElementById('stationCount').textContent='Stations: '+stations.length;
 document.getElementById('trackCount').textContent='Track: '+tracks.length+' sections';
 document.getElementById('undoBtn').disabled=historyIndex<=0;
 document.getElementById('redoBtn').disabled=historyIndex>=history.length-1;
}

function setMode(newMode){
 mode=newMode;
 selected=null;

 document.getElementById('stationBtn').classList.toggle('active',mode==='station');
 document.getElementById('trackBtn').classList.toggle('active',mode==='track');

 renderNetwork();

 if(mode==='station')message('Tap the map to place a station ($500).');
 if(mode==='track')message('Tap one station, then another station to connect them ($150).');
 if(mode==='inspect')message('Tap a station to inspect it.');
}

function resetSelection(){
 selected=null;
 renderNetwork();
 message('Selection cleared.');
}

function handleStationClick(index){
 if(mode==='track'){
  if(selected===null){
   selected=index;
   renderNetwork();
   message(stations[index].name+' selected. Now tap another station.');
   return;
  }

  if(selected===index){
   selected=null;
   renderNetwork();
   message('Selection cleared.');
   return;
  }

  let first=selected;
  let second=index;

  if(tracks.some(t=>
   (t.a===first&&t.b===second)||
   (t.a===second&&t.b===first)
  )){
   selected=null;
   renderNetwork();
   message('These stations are already connected.');
   return;
  }

  if(money<150){
   selected=null;
   renderNetwork();
   message('Not enough money to build track.');
   return;
  }

  money-=150;
  tracks.push({a:first,b:second});
  selected=null;
  saveHistory();
  renderNetwork();
  message('Track successfully connected to both stations!');
  return;
 }

 if(mode==='inspect'){
  let connections=tracks.filter(t=>t.a===index||t.b===index).length;
  message(stations[index].name+' — '+connections+' connected track sections.');
  return;
 }

 if(mode==='station'){
  message(stations[index].name+' already exists. Select Build Track to connect it.');
 }
}

map.on('click',function(e){
 if(mode==='station'){
  if(money<500){
   message('Not enough money for a station.');
   return;
  }

  money-=500;
  stations.push({
   lat:e.latlng.lat,
   lng:e.latlng.lng,
   name:'Station '+(stations.length+1)
  });

  saveHistory();
  renderNetwork();
  message('Station built successfully.');
 }
 else if(mode==='track'){
  message('Tap an existing station marker, not the map, to select it.');
 }
});

function toggleSimulation(){
 if(running){
  clearInterval(simulation);
  simulation=null;
  running=false;
  document.getElementById('runBtn').textContent='▶ Run Trains';

  trainMarkers.forEach(m=>map.removeLayer(m));
  trainMarkers=[];
  message('Simulation paused.');
  return;
 }

 if(stations.length<2||tracks.length<1){
  message('Build and connect at least two stations first.');
  return;
 }

 running=true;
 document.getElementById('runBtn').textContent='Ⅱ Pause';
 message('Trains are running!');

 simulation=setInterval(function(){
  if(tracks.length===0)return;

  let track=tracks[Math.floor(Math.random()*tracks.length)];
  let from=stations[track.a];
  let to=stations[track.b];

  let train=L.circleMarker([from.lat,from.lng],{
   radius:7,
   color:'#ffffff',
   weight:2,
   fillColor:'#e5a52b',
   fillOpacity:1
  }).addTo(map);

  trainMarkers.push(train);
  let steps=0;

  let movement=setInterval(function(){
   steps++;
   let fraction=steps/20;

   train.setLatLng([
    from.lat+(to.lat-from.lat)*fraction,
    from.lng+(to.lng-from.lng)*fraction
   ]);

   if(steps>=20){
    clearInterval(movement);
    map.removeLayer(train);
    trainMarkers=trainMarkers.filter(m=>m!==train);
   }
  },100);

  passengers+=Math.floor(Math.random()*12)+5;
  money+=Math.floor(Math.random()*100)+25;
  updateUI();

 },2500);
}

history.push(snapshot());
updateUI();
renderNetwork();
</script>
</body>
</html>
